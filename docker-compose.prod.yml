# Production stack — one Ubuntu VPS (ArvanCloud cloud server or any other provider).
#
#   cp .env.prod.example .env.prod   # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only Caddy publishes ports (80/443). Postgres, Redis, backend, frontend and Umami are reachable
# only on the internal docker network. See docs/deploy.md.
name: dadrosebook-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  image: dadrosebook-backend:prod  # one image shared by backend and worker
  build:
    context: ./backend
  restart: unless-stopped
  logging: *logging
  # All app settings (SECRET_KEY, ALLOWED_HOSTS, S3, SMS, …). "required: false" only so that
  # `config` can be validated with the example file; without it the backend refuses to start
  # (SECRET_KEY is mandatory). ENV_FILE overrides the file name.
  env_file:
    - path: ${ENV_FILE:-.env.prod}
      required: false
  environment: &backend-env
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DEBUG: "false"
    DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    GUNICORN_CMD_ARGS: ${GUNICORN_CMD_ARGS:---timeout 60 --graceful-timeout 30 --max-requests 2000 --max-requests-jitter 200 --control-socket /tmp/gunicorn.ctl}
  volumes:
    # Used only when USE_S3=false (local disk storage). media/ is served by Caddy at /media/,
    # private_media/ (ebooks) is never served by anything.
    - media:/app/media
    - private_media:/app/private_media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Read by deploy/postgres/init-umami.sh (runs once, on an empty data volume).
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-umami.sh:/docker-entrypoint-initdb.d/10-init-umami.sh:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction  # Celery broker: never evict queued tasks
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384m

  backend:
    <<: *backend
    # Dockerfile CMD: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    # entrypoint.sh waits for the DB, runs migrate and collectstatic before starting it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"  # the backend container migrates
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m

  # celery beat: omitted on purpose — config/celery.py and the settings define no periodic tasks
  # (no CELERY_BEAT_SCHEDULE). When one is added, add a service like:
  #   beat:
  #     <<: *backend
  #     command: ["celery", "-A", "config", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
  #     environment: { <<: *backend-env, RUN_MIGRATIONS: "0" }
  #     depends_on: { backend: { condition: service_healthy } }

  frontend:
    image: dadrosebook-frontend:prod
    build:
      context: ./frontend
      target: prod
      # NEXT_PUBLIC_* are inlined into the JS bundle at BUILD time: after changing any of them,
      # rebuild: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
        NEXT_PUBLIC_MEDIA_HOST: ${NEXT_PUBLIC_MEDIA_HOST:-}
        NEXT_PUBLIC_SITE_ENV: ${NEXT_PUBLIC_SITE_ENV:-production}
        NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_WEB_VITALS_SAMPLE_RATE: ${NEXT_PUBLIC_WEB_VITALS_SAMPLE_RATE:-}
    restart: unless-stopped
    logging: *logging
    environment:
      API_INTERNAL_URL: http://backend:8000/api/v1
      USE_API_FIXTURES: "0"
      # Also present at runtime for server code that reads process.env directly.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
      NEXT_PUBLIC_MEDIA_HOST: ${NEXT_PUBLIC_MEDIA_HOST:-}
      NEXT_PUBLIC_SITE_ENV: ${NEXT_PUBLIC_SITE_ENV:-production}
      NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/robots.txt || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m

  umami:
    # Self-hosted analytics (docs/phase-5-contract.md §3). Pin a version tag after the first
    # successful deploy, e.g. UMAMI_IMAGE=ghcr.io/umami-software/umami:<version>.
    image: ${UMAMI_IMAGE:-ghcr.io/umami-software/umami:latest}
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?}
      DISABLE_TELEMETRY: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?}
      STATS_DOMAIN: ${STATS_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      # Extra trusted reverse proxies (e.g. ArvanCloud CDN ranges), space separated. See Caddyfile.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # TLS certificates — keep this volume
      - caddy_config:/config
      - media:/srv/media:ro  # public uploads when USE_S3=false (never private_media)
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      umami:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
  redisdata:
  media:
  private_media:
  caddy_data:
  caddy_config:
