[project]
name = "dadrose-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/migrations/*.py", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "C4", "SIM", "RUF", "BLE", "S"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Persian/Arabic characters are intentional
    "RUF012",                      # Django Meta/admin class attributes
    "S101",                        # assert in tests
    "S308",                        # format_html is safe
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"config/settings/*.py" = ["F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "-q --reuse-db"
testpaths = ["apps"]
filterwarnings = [
    "ignore:The default scheme will be changed:django.utils.deprecation.RemovedInDjango60Warning",
]
