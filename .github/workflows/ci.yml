# Continuous integration: lint + tests for the backend and frontend. No deployment.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dadrose
          POSTGRES_USER: dadrose
          POSTGRES_PASSWORD: dadrose
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dadrose -d dadrose"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://dadrose:dadrose@localhost:5432/dadrose
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Pytest
        run: pytest --create-db
      - name: Production settings (check --deploy)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-only-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyz0123456789
          ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
        run: python manage.py check --deploy --fail-level ERROR

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build (API fixtures, no backend needed)
        env:
          USE_API_FIXTURES: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  shell:
    name: Deploy scripts and compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck deploy/*.sh deploy/postgres/*.sh
      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config -q
